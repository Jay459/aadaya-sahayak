services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aadaya
      POSTGRES_USER: aadaya
      POSTGRES_PASSWORD: local-development-only
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - aadaya-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aadaya -d aadaya']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  aadaya-data:
